# Configuração do Sistema de Upgrade Ionic/Angular
# Especializado para projetos empresariais com 50+ componentes

# Configurações do Projeto
project:
  name: "Enterprise Ionic Angular App"
  path: "./ionic-angular-project"
  backup_path: "./backups"
  
# Versões de Origem e Destino
versions:
  current:
    angular: "12.2.0"
    ionic: "5.9.0"
    typescript: "4.3.5"
    node: "14.x"
  target:
    angular: "18.0.0"  # Versão mais recente LTS
    ionic: "8.0.0"     # Versão mais recente
    typescript: "5.4.0"
    node: "18.x"

# Configurações de Upgrade
upgrade_settings:
  # Estratégia de migração
  migration_strategy: "incremental"  # incremental | direct
  
  # Fases de upgrade incremental
  incremental_phases:
    - { from: "12", to: "13", duration: "2h" }
    - { from: "13", to: "14", duration: "2h" }
    - { from: "14", to: "15", duration: "2h" }
    - { from: "15", to: "16", duration: "3h" }
    - { from: "16", to: "17", duration: "3h" }
    - { from: "17", to: "18", duration: "4h" }
  
  # Configurações de segurança
  safety:
    create_backup: true
    backup_retention_days: 30
    rollback_enabled: true
    validation_required: true
    
  # Configurações de teste
  testing:
    run_unit_tests: true
    run_e2e_tests: true
    run_lint: true
    performance_threshold: 80  # Score mínimo de performance
    
  # Configurações de componentes
  components:
    max_components_per_batch: 10
    parallel_processing: false  # Para projetos grandes, manter false
    component_validation: true

# Breaking Changes Conhecidos
breaking_changes:
  angular:
    "12_to_13":
      - "Ivy renderer obrigatório"
      - "ViewEngine removido"
      - "Angular Package Format changes"
    "13_to_14":
      - "Optional injectors em Embedded Views"
      - "Extended developer mode"
    "14_to_15":
      - "Standalone APIs"
      - "Directive composition API"
    "15_to_16":
      - "Required inputs"
      - "Router data as input"
    "16_to_17":
      - "New control flow syntax"
      - "View Transitions API"
    "17_to_18":
      - "Material 3 support"
      - "Built-in control flow stable"
      
  ionic:
    "5_to_6":
      - "ion-slides removido (usar Swiper)"
      - "ion-virtual-scroll changes"
    "6_to_7":
      - "iOS 13+ required"
      - "Android API 22+ required"
    "7_to_8":
      - "Capacitor 6 required"
      - "New form controls"

# Mapeamento de Dependências
dependency_mapping:
  # Ionic Native para Awesome Cordova Plugins
  ionic_native_migration:
    "@ionic-native/core": "@awesome-cordova-plugins/core"
    "@ionic-native/camera": "@awesome-cordova-plugins/camera"
    "@ionic-native/file": "@awesome-cordova-plugins/file"
    "@ionic-native/http": "@awesome-cordova-plugins/http"
    
  # Angular Material
  angular_material:
    "@angular/material": "^18.0.0"
    "@angular/cdk": "^18.0.0"
    
  # RxJS
  rxjs_migration:
    "6.x": "7.x"  # Angular 12-15
    "7.x": "7.x"  # Angular 16+

# Configurações de Validação
validation:
  # Checkpoints obrigatórios
  checkpoints:
    - "project_backup_created"
    - "dependencies_updated"
    - "build_successful"
    - "unit_tests_pass"
    - "e2e_tests_pass"
    - "performance_acceptable"
    
  # Critérios de sucesso
  success_criteria:
    build_success: true
    test_pass_rate: 95  # Porcentagem mínima
    performance_score: 80
    zero_critical_errors: true
    
  # Critérios de rollback
  rollback_triggers:
    - "build_failure"
    - "critical_test_failures"
    - "performance_degradation_50%"
    - "data_corruption_detected"

# Configurações de Relatório
reporting:
  # Formatos de saída
  formats:
    - "json"
    - "html"
    - "pdf"
    
  # Seções do relatório
  sections:
    - "executive_summary"
    - "technical_analysis"
    - "component_details"
    - "performance_metrics"
    - "recommendations"
    - "risk_assessment"
    
  # Destinatários
  stakeholders:
    technical:
      - "tech_lead@company.com"
      - "senior_dev@company.com"
    management:
      - "project_manager@company.com"
      - "cto@company.com"

# Configurações de Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file_path: "./logs/upgrade.log"
  max_file_size: "10MB"
  backup_count: 5
  
  # Categorias de log
  categories:
    - "system"
    - "analysis"
    - "upgrade"
    - "validation"
    - "errors"

# Configurações de Performance
performance:
  # Timeouts
  timeouts:
    analysis: 300  # 5 minutos
    upgrade_phase: 1800  # 30 minutos
    validation: 600  # 10 minutos
    
  # Recursos
  resources:
    max_memory_usage: "4GB"
    max_cpu_usage: 80  # Porcentagem
    
  # Otimizações
  optimizations:
    parallel_analysis: false
    cache_dependencies: true
    incremental_builds: true

# Configurações de Ambiente
environment:
  # Variáveis necessárias
  required_env_vars:
    - "NODE_ENV"
    - "IONIC_ENV"
    
  # Ferramentas necessárias
  required_tools:
    - { name: "node", version: "18.x" }
    - { name: "npm", version: "9.x" }
    - { name: "ionic", version: "7.x" }
    - { name: "angular-cli", version: "18.x" }
    
  # Verificações de sistema
  system_checks:
    disk_space_gb: 10
    memory_gb: 8
    internet_connection: true

# Configurações de Segurança
security:
  # Verificações de segurança
  security_checks:
    audit_dependencies: true
    check_vulnerabilities: true
    validate_signatures: true
    
  # Políticas
  policies:
    allow_beta_versions: false
    require_lts_versions: true
    max_vulnerability_score: 7.0  # CVSS score
    
  # Backup e recovery
  backup:
    encryption: true
    compression: true
    verification: true

# Configurações Específicas do Projeto
project_specific:
  # Arquivos críticos para backup
  critical_files:
    - "package.json"
    - "package-lock.json"
    - "angular.json"
    - "ionic.config.json"
    - "tsconfig.json"
    - "src/app/**/*.ts"
    - "src/app/**/*.html"
    - "src/app/**/*.scss"
    
  # Diretórios a ignorar
  ignore_directories:
    - "node_modules"
    - "dist"
    - "platforms"
    - "plugins"
    - ".git"
    
  # Extensões de arquivo suportadas
  supported_extensions:
    - ".ts"
    - ".js"
    - ".html"
    - ".scss"
    - ".css"
    - ".json"

# Configurações de Notificação
notifications:
  # Canais de notificação
  channels:
    email:
      enabled: true
      smtp_server: "smtp.company.com"
      port: 587
    slack:
      enabled: false
      webhook_url: ""
    teams:
      enabled: false
      webhook_url: ""
      
  # Eventos para notificação
  events:
    - "upgrade_started"
    - "phase_completed"
    - "error_occurred"
    - "upgrade_completed"
    - "rollback_executed"

# Configurações de Integração
integration:
  # CI/CD
  cicd:
    jenkins:
      enabled: false
      job_url: ""
    github_actions:
      enabled: true
      workflow_file: ".github/workflows/upgrade.yml"
    azure_devops:
      enabled: false
      pipeline_id: ""
      
  # Ferramentas de monitoramento
  monitoring:
    sonarqube:
      enabled: true
      server_url: "https://sonar.company.com"
    newrelic:
      enabled: false
      api_key: ""

# Configurações Avançadas
advanced:
  # Configurações experimentais
  experimental:
    ai_assisted_refactoring: true
    predictive_analysis: true
    auto_optimization: false
    
  # Configurações de debug
  debug:
    verbose_logging: false
    save_intermediate_files: true
    generate_debug_report: true
    
  # Configurações de cache
  cache:
    enabled: true
    ttl_hours: 24
    max_size_mb: 500
    
  # Configurações de retry
  retry:
    max_attempts: 3
    backoff_factor: 2
    timeout_multiplier: 1.5